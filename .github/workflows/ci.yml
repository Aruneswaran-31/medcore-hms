name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · typecheck, lint, test
    runs-on: ubuntu-latest
    env:
      # prisma validate/generate resolve env("DATABASE_URL") at parse time.
      # CI never opens a connection, so a placeholder is enough.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/medcore?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend db:generate

      - name: Validate Prisma schema
        run: pnpm --filter backend exec prisma validate

      - name: Typecheck
        run: pnpm --filter types build && pnpm --filter backend typecheck

      - name: Lint
        run: pnpm --filter backend lint

      - name: Test
        run: pnpm --filter backend test

      - name: Build
        run: pnpm --filter backend build

  frontend:
    name: Frontend · typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Shared types
        run: pnpm --filter types build

      - name: Typecheck
        run: pnpm --filter frontend typecheck

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Build
        run: pnpm --filter frontend build
        env:
          NEXT_PUBLIC_API_URL: ""
